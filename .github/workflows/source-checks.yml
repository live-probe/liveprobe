name: source-checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npm test
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: lptest
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d lptest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LIVEPROBE_TEST_DB_ADMIN: postgresql+psycopg://test:test@localhost:55432/lptest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --frozen --group dev
        working-directory: liveprobe
      # The runner sandbox never pulls (--pull=never); provision the exact pinned test images up front.
      - run: |
          docker pull python:3.12-slim-bookworm@sha256:392307d22300de8b5986851a12d9176dfc0fc073e65bf6523ebd7dcbeb23564e
          docker pull node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
      - run: uv run pytest -p no:cacheprovider
        working-directory: liveprobe
      - run: liveprobe/.venv/bin/python -m pytest -q -p no:cacheprovider evaluation/tests
