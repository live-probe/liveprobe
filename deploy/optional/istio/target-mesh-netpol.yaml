# Sidecar <-> istiod control-plane traffic and Prometheus/Kiali scraping for namespaces joined to the mesh.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-istiod-egress, namespace: liveprobe-target}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: istio-system}}
      ports: [{port: 15012, protocol: TCP}, {port: 15010, protocol: TCP}, {port: 15014, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-mesh-telemetry-ingress, namespace: liveprobe-target}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: liveprobe-observability}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: istio-system}}
      ports: [{port: 15090, protocol: TCP}, {port: 15020, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-istiod-egress, namespace: liveprobe-system}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: istio-system}}
      ports: [{port: 15012, protocol: TCP}, {port: 15010, protocol: TCP}, {port: 15014, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-mesh-telemetry-ingress, namespace: liveprobe-system}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: liveprobe-observability}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: istio-system}}
      ports: [{port: 15090, protocol: TCP}, {port: 15020, protocol: TCP}]
