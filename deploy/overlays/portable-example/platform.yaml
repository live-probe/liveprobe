# Platform parameters for the render-only portability overlay (placeholder values, see kustomization.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: liveprobe-platform
  annotations:
    config.kubernetes.io/local-config: "true"
data:
  ingressClassName: nginx
  storageClassName: standard-rwo
  liveprobeHost: liveprobe.example.test
  grafanaHost: grafana.example.test
  ingressNamespace: ingress-nginx
  ingressPodName: ingress-nginx
  apiserverCIDR: 192.0.2.10/32
  nodeCIDR: 192.0.2.11/32
  # Asserted by scripts/check-overlay.py: every rendered image must come from this registry.
  imageRegistry: registry.example.test
