apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Explicitly opt in for operator-controlled fault tests. Never use for routine installation.
# KAN-96 v1 fault API contract (t_21061685): this is the ONLY overlay that enables the Spring `chaos`
# profile, the chaos operator token Secret refs, the durable crash/oom intent volume, the order DB wiring,
# the loadgen -> order gateway sidecar and the two order<->postgres NetworkPolicies.
# Fault routes stay loopback-only in-app (reached via `kubectl port-forward pod/...`); no Ingress, Route,
# NodePort, LoadBalancer or hostPort is added. Every object this overlay ADDS carries
# `liveprobe.io/chaos-overlay: "true"`; scripts/check-chaos-overlay.py asserts the render.
# Secrets referenced (values generated by scripts/create-secrets.sh, never committed):
#   liveprobe-target/inventory-chaos-operator:token, liveprobe-target/order-chaos-operator:token,
#   liveprobe-target/order-db:password (role/db applied by scripts/provision-order-db.sh).
resources:
  - ../rancher-desktop
  - network-policies.yaml
  - order-gateway.yaml
patches:
  - path: order-config.yaml
  - target:
      kind: Deployment
      name: inventory
      namespace: liveprobe-target
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPRING_PROFILES_ACTIVE
          value: chaos
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: CHAOS_OPERATOR_TOKEN
          valueFrom:
            secretKeyRef:
              name: inventory-chaos-operator
              key: token
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: CHAOS_STATE_DIR
          value: /var/run/liveprobe-chaos
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: chaos-state
            mountPath: /var/run/liveprobe-chaos
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: chaos-state
            emptyDir:
              sizeLimit: 1Mi
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe
        value:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          periodSeconds: 1
          failureThreshold: 1
          successThreshold: 1
          timeoutSeconds: 1
  - target:
      kind: Deployment
      name: order
      namespace: liveprobe-target
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: SPRING_PROFILES_ACTIVE
            value: chaos
          - name: CHAOS_OPERATOR_TOKEN
            valueFrom:
              secretKeyRef:
                name: order-chaos-operator
                key: token
          - name: ORDER_DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: order-db
                key: password
          - name: CHAOS_STATE_DIR
            value: /var/run/liveprobe-chaos
          # KAN-120: disable HttpURLConnection keep-alive (order -> inventory RestClient uses
          # SimpleClientHttpRequestFactory) so every inventory call opens a new TCP connection through the
          # inventory ClusterIP. Measured: pooled ESTABLISHED connections survive the EndpointSlice going to
          # ready=0, so inventory endpoint_off produced no order 502 (contract §2.5). The first two options
          # repeat the image default (services/order/Dockerfile ENV), which a Pod env var would otherwise replace.
          - name: JAVA_TOOL_OPTIONS
            value: -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError -Dhttp.keepAlive=false
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: chaos-state
            mountPath: /var/run/liveprobe-chaos
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: chaos-state
            emptyDir:
              sizeLimit: 1Mi
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe
        value:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          periodSeconds: 1
          failureThreshold: 1
          successThreshold: 1
          timeoutSeconds: 1
  # §2.5 approved upstream caller: loadgen -> 127.0.0.1:8088 order-gateway sidecar -> order Service.
  # Same log format as base (`loadgen item=<i> status=<code> n=<n>`), sequential, every 0.5 s, --max-time 5.
  - target:
      kind: Deployment
      name: loadgen
      namespace: liveprobe-target
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - |
            i=0
            while true; do
              for item in a b widget gadget; do
                code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://127.0.0.1:8088/api/orders/check?item=$item")
                i=$((i+1))
                if [ "$code" != "200" ] || [ $((i % 30)) -eq 0 ]; then echo "loadgen item=$item status=$code n=$i"; fi
                sleep 0.5
              done
            done
      - op: add
        path: /spec/template/spec/containers/-
        value:
          name: order-gateway
          # Pull-only (never pushed): multi-arch index digest of nginxinc/nginx-unprivileged:1.27-alpine.
          image: nginxinc/nginx-unprivileged:1.27-alpine@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: order-gateway-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: order-gateway-conf
            configMap:
              name: order-gateway
