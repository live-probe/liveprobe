# KAN-96 §2.5: approved upstream caller path loadgen -> order. nginx sidecar in the loadgen Pod, bound to
# 127.0.0.1:8088 (not reachable from other Pods). Only /api/orders/ is proxied; every other path (including
# /internal/**) is answered 404 locally. No retries, so each order failure is one observed 5xx.
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-gateway
  namespace: liveprobe-target
  labels:
    app: loadgen
    app.kubernetes.io/part-of: liveprobe-target
    liveprobe.io/chaos-overlay: "true"
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events {
      worker_connections 64;
    }
    http {
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      server_tokens off;
      log_format gw 'gw status=$status upstream_status=$upstream_status upstream_addr=$upstream_addr rt=$request_time time=$time_iso8601';
      access_log /dev/stdout gw;
      upstream order_svc {
        server order.liveprobe-target.svc:8080;
      }
      server {
        listen 127.0.0.1:8088;
        location /api/orders/ {
          proxy_pass http://order_svc;
          # nginx defaults to HTTP/1.0; the Istio sidecar on `order` answers 426 to it (mesh added 2026-10-05).
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_set_header Host order.liveprobe-target.svc;
          proxy_connect_timeout 1s;
          proxy_read_timeout 5s;
          proxy_next_upstream off;
        }
        location / {
          return 404;
        }
      }
    }
