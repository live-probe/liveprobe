apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: liveprobe-observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.liveprobe-observability.svc:9090
        isDefault: true
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.liveprobe-observability.svc:3100
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: liveprobe-observability
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: LiveProbe
        orgId: 1
        folder: LiveProbe
        type: file
        disableDeletion: true
        allowUiUpdates: false
        options:
          path: /etc/grafana/dashboards
  liveprobe.json: |
    {
      "uid": "liveprobe-overview",
      "title": "LiveProbe Overview",
      "schemaVersion": 41,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {
          "id": 1, "title": "Scrape targets", "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "up{job=~\"kube-state-metrics|kubernetes-pods\"}", "refId": "A", "legendFormat": "{{job}} {{app}} {{pod}}"}]
        },
        {
          "id": 2, "title": "Target container restarts", "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "kube_pod_container_status_restarts_total{namespace=\"liveprobe-target\"}", "refId": "A", "legendFormat": "{{pod}} {{container}}"}]
        },
        {
          "id": 3, "title": "Target Pod logs", "type": "logs",
          "gridPos": {"h": 10, "w": 24, "x": 0, "y": 8},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "{namespace=\"liveprobe-target\",app=~\"order|inventory\"}", "refId": "A"}]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: liveprobe-observability
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:13.2.2
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          ports:
            - containerPort: 3000
              name: http
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 192Mi
            limits:
              memory: 448Mi
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard-files
              mountPath: /etc/grafana/dashboards
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboards
            items:
              - key: dashboards.yaml
                path: dashboards.yaml
        - name: dashboard-files
          configMap:
            name: grafana-dashboards
            items:
              - key: liveprobe.json
                path: liveprobe.json
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: liveprobe-observability
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: liveprobe-observability
spec:
  rules:
    - host: grafana.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
