---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: liveprobe-secret-writer-boundary
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE, CONNECT]
        resources: ["*/*"]
  matchConditions:
    - name: dedicated-identity
      expression: "request.userInfo.username == 'system:serviceaccount:liveprobe-system:liveprobe-secret-writer'"
  variables:
    - name: target
      expression: "object != null ? object : oldObject"
  validations:
    - expression: >-
        request.resource.group == '' && request.resource.resource == 'secrets' &&
        (!has(request.subResource) || request.subResource == '') && request.operation == 'UPDATE' && object != null && oldObject != null
      message: existing Secret patch only (RBAC grants patch, not update)
    - expression: >-
        !((has(request.namespace) ? request.namespace : '') in ['liveprobe-system', 'liveprobe-observability']) &&
        !variables.target.metadata.name.startsWith('liveprobe-') &&
        !variables.target.metadata.name.startsWith('safe-action-') &&
        !variables.target.metadata.name.startsWith('rollback-controller')
      message: protected credential objects
    - expression: >-
        oldObject != null && object != null &&
        (!has(oldObject.type) || oldObject.type != 'kubernetes.io/service-account-token') &&
        (!has(object.type) || object.type != 'kubernetes.io/service-account-token') &&
        (has(object.type) ? object.type : '') == (has(oldObject.type) ? oldObject.type : '') &&
        (has(object.immutable) ? object.immutable : false) == (has(oldObject.immutable) ? oldObject.immutable : false) &&
        (!has(oldObject.metadata.annotations) || !('kubernetes.io/service-account.name' in oldObject.metadata.annotations)) &&
        object.metadata.all(k, k in ['resourceVersion', 'managedFields'] || (k in oldObject.metadata && object.metadata[k] == oldObject.metadata[k])) &&
        oldObject.metadata.all(k, k in ['resourceVersion', 'managedFields'] || k in object.metadata) &&
        object.all(k, k in ['apiVersion', 'kind', 'metadata', 'type', 'immutable', 'data', 'stringData'])
      message: Secret data only; token type, metadata and immutability protected
