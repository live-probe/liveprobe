---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: liveprobe-target
  labels:
    app: loadgen
    app.kubernetes.io/part-of: liveprobe-target
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadgen
  template:
    metadata:
      labels:
        app: loadgen
        app.kubernetes.io/part-of: liveprobe-target
    spec:
      containers:
        - name: loadgen
          image: curlimages/curl:8.22.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              i=0
              while true; do
                for item in a b widget gadget; do
                  code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://order.liveprobe-target.svc:8080/api/orders/check?item=$item")
                  i=$((i+1))
                  if [ "$code" != "200" ] || [ $((i % 30)) -eq 0 ]; then echo "loadgen item=$item status=$code n=$i"; fi
                  sleep 2
                done
              done
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 16Mi
